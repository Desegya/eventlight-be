# Production compose: app only, expects an EXTERNAL managed database
# (e.g. AWS RDS, DigitalOcean Managed Postgres, Render Postgres, etc.).
#
# Usage:
#   cp .env.prod.example .env.prod   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Required env vars (see .env.prod.example):
#   SECRET_KEY, DATABASE_URL
# The app runs the existing Dockerfile CMD: migrate + gunicorn (3 workers).

services:
  web:
    build: .
    image: eventlight-be:prod
    container_name: eventlight-web-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DEBUG: "false"
      # DATABASE_URL must point to your external/managed Postgres, e.g.
      # postgres://USER:PASSWORD@your-db-host:5432/DBNAME?sslmode=require
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      PORT: ${PORT:-8000}
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # No source mount in prod; run the baked image only.
    # No db service; the database is external and reached via DATABASE_URL.
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
