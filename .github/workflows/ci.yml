name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "false"
      SECRET_KEY: ci-test-secret-key-not-used-anywhere-else-1234567890
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --deploy --dev

      - name: Django system check
        run: pipenv run python manage.py check

      - name: Deploy check (production settings)
        run: pipenv run python manage.py check --deploy

      - name: Run tests
        # Production settings otherwise 301 every plain-http test request to https.
        env:
          SECURE_SSL_REDIRECT: "false"
        run: pipenv run python manage.py test

      - name: Check for missing migrations
        run: pipenv run python manage.py makemigrations --check --dry-run

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t eventlight-be:ci .
